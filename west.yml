# SPDX-License-Identifier: MIT
#
# SP-Mix west manifest (application is the manifest repository).
#
#   west init -l sp-mix
#   west update --narrow -o=--depth=1
#   sp-mix/scripts/apply-zephyr-patches.sh
#
# Only the modules an nRF52840 build needs are pulled.

manifest:
  self:
    path: sp-mix

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.3.1
      import:
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_nordic
