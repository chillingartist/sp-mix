#
# Full build. conf/m0.conf and conf/m1.conf strip it down for the early
# milestones (scripts/build.sh selects them).

# Kernel
CONFIG_FPU=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_REBOOT=y
CONFIG_HWINFO=y
CONFIG_ASSERT=n
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SPEED_OPTIMIZATIONS=y

# Diagnostics: watchdog culprit from a zero latency ISR, per-thread CPU use
CONFIG_ZERO_LATENCY_IRQS=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=y

# Peripherals
CONFIG_GPIO=y
# The SAADC is driven directly (src/platform/inputs.c)
CONFIG_ADC=n
CONFIG_PWM=y

# Internal flash for scenes
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y

# USB: UAC2 (adaptive, 784 byte packets) + CDC ACM
CONFIG_UDC_NRF_ISO_OUT_ONLY=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_THREAD_STACK_SIZE=1536

# The main thread runs the control loop, below the audio thread
CONFIG_MAIN_THREAD_PRIORITY=4
