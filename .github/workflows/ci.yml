# SPDX-License-Identifier: MIT
#
# host-tests: unit tests of the portable core (src/core) on the build host.
# firmware:   builds the m0, m1, full and full-midi (full with MIDI control)
#             variants with Zephyr v4.3.1 and uploads zephyr.bin and
#             zephyr.elf for each.
# release:    on a v* tag, or when run by hand with a version, creates a
#             draft GitHub release with the firmware of all variants and
#             that version's CHANGELOG section. A release run by hand
#             creates its tag on the built commit when it is published, so
#             its firmware is built with that version as its 'fw' string.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Make a draft release, e.g. v0.1.0 (empty: just build)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc

      - name: Configure
        run: cmake -S tests/host -B build-host -G Ninja

      - name: Build
        run: cmake --build build-host

      - name: Run
        run: ctest --test-dir build-host --output-on-failure

  firmware:
    name: firmware (${{ matrix.variant }})
    runs-on: ubuntu-latest
    # Zephyr CI image with Zephyr SDK 0.17.4: the image Zephyr v4.3.1's own
    # CI uses (as ci-repo-cache:v0.28.6.20251003).
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.28.6
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: m0, target: m0 }
          - { variant: m1, target: m1 }
          - { variant: full, target: full }
          - { variant: full-midi, target: full, midi: '1' }
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: sp-mix
          persist-credentials: false
          # Tags too: 'status' shows git describe of the build (e.g. v0.1.0)
          fetch-depth: 0

      - name: Set up the west workspace
        run: |
          # The workspace is owned by another UID than the container user
          git config --global --add safe.directory '*'
          west init -l sp-mix
          west update --narrow -o=--depth=1
          # HOME differs from the image's user, so the SDK's CMake package
          # registration is not found: point at the SDK directly.
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/zephyr-sdk-${ZSDK_VERSION}" >> "$GITHUB_ENV"

      - name: Apply Zephyr patches
        run: sp-mix/scripts/apply-zephyr-patches.sh

      - name: Build ${{ matrix.variant }}
        env:
          SP1M_MIDI: ${{ matrix.midi }}
          # A release run by hand: the tag does not exist yet
          SP1M_GIT: ${{ inputs.version }}
        run: sp-mix/scripts/build.sh ${{ matrix.target }}

      - name: Upload firmware
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sp-mix-${{ matrix.variant }}
          path: |
            sp-mix/build-${{ matrix.variant }}/zephyr/zephyr.bin
            sp-mix/build-${{ matrix.variant }}/zephyr/zephyr.elf
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [host-tests, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Download firmware
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: sp-mix-*
          path: artifacts

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          mkdir dist
          for v in m0 m1 full full-midi; do
            cp "artifacts/sp-mix-$v/zephyr.bin" "dist/sp-mix-$v.bin"
            cp "artifacts/sp-mix-$v/zephyr.elf" "dist/sp-mix-$v.elf"
          done
          # Notes: this version's section of CHANGELOG.md
          ver="${TAG#v}"
          awk -v v="$ver" '
            /^## \[/ { on = index($0, "[" v "]") > 0; next }
            on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md." > notes.md
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "version must look like v0.1.0, got '$TAG'"; exit 1 ;;
          esac
          gh release create "$TAG" dist/* --draft --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SP-Mix $TAG" --notes-file notes.md
